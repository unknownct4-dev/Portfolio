<!DOCTYPE html>

<html>

<head>
    <title>Vertical Navbar</title>

    <style>
        * {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            box-sizing: border-box;
        }

        ul {
            list-style-type: none;
            background-color: aqua;
            height: 100%;
            position: fixed;
            margin: 0;
            padding: 0;
            z-index: 100;
            width: 200px;
        }

        ul.main {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding-top: 20px;

            gap: 5px;
        }

        a {
            display: block;
            color: black;
            padding: 8px 16px;
            text-decoration: none;
        }

        .options {
            opacity: 0;
            visibility: hidden;
            position: absolute;
            left: 100%;
            top: 0;
            background-color: darkgray;
            border-radius: 1rem;
            transition: all .3s ease;
            min-width: 150px;
            box-shadow: 4px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .main .options .link {
            color: white;
            padding: 1rem;
            border: .5rem;
            cursor: pointer;
            transition: background .2 ease;

        }

        .dropdown {
            position: relative;
        }

        .dropdown:hover .options {
            opacity: 1;
            visibility: visible;
        }

        .options .link:hover {
            background-color: #38444D;
            color: white;
            box-shadow: 0 0 15px #38444D;
        }

        .link {
            transition: all 0.3s ease;
        }

        .link:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff;
            transform: scale(1.05);
            transition: all 0.2s ease-in-out;
            border-radius: 15px;
        }
    </style>


</head>


<body>

    <audio id="hover-sound" src="assets/Lightsaber Swing - Sound Effects for editing.mp3" preload="auto"></audio>

    <ul class="main">
        <li><a href="#" class="link">Home</a></li>
        <li class="dropdown">
            <a href="#" href="javascript:void(0)" class="dropbtn link">Projects</a>
            <div class="options">
                <a href="#" class="link">Project 1</a>
                <a href="#" class="link">Project 2</a>
                <a href="#" class="link">Project 3</a>
            </div>
        </li>
        <li><a href="#" class="link">Schedule</a></li>
        <li><a href="#" class="link">Contact</a></li>

        
    </ul>

    <div>


    </div>

    <script>
        // 1. Get the audio element
        const sound = document.getElementById("hover-sound");

        // 2. Select all links with the class 'nav-link'
        const links = document.querySelectorAll(".link");

        // 3. Add the hover event to each link
        links.forEach(link => {
            link.addEventListener("mouseenter", () => {
                sound.currentTime = 0; // Reset sound to start (in case it's already playing)
                sound.play();          // Play the sound
            });
        });
    </script>



</body>




</html>
